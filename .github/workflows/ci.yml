name: Standalone checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Lua camera, input, gestures, and diagnostic mocks
        run: lua5.3 tests/run.lua
      - name: Python tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python syntax
        run: python3 -m compileall -q tools tests
